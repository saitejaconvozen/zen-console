<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Harness Console</title>
<meta name="description" content="Research console for the capability-conditioned synthetic conversation corpus.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar"><div class="in">
  <span class="brand"><i></i>Zen Harness</span>
  <nav class="tabs" aria-label="Sections">
    <a href="#/explore" data-route="explore">Corpus</a>
    <a href="#/overview" data-route="overview">Overview</a>
    <a href="#/domains" data-route="domains">Domains</a>
    <a href="#/capabilities" data-route="capabilities">Capabilities</a>
    <a href="#/architecture" data-route="architecture">Architecture</a>
    <a href="#/runs" data-route="runs">Runs</a>
  </nav>
  <div class="end">
    <span class="pill" id="status">connecting</span>
    <button class="btn sm" id="reindex" title="Re-scan generated/ for new traces">reindex</button>
    <input class="tokenin" id="token" placeholder="write token" aria-label="Write token">
  </div>
</div></header>
<main id="app"><div class="empty"><span class="spinner"></span>Loading</div></main>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
